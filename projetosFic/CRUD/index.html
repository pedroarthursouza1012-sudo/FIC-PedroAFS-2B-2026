<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Elms+Sans:ital,wght@0,100..900;1,100..900&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">


    <title>NovaDex</title>
</head>
<body>

<div class="intro" id="intro">
    <button id="iniciarIntro" class="start">INICIAR EXPERIÊNCIA</button>

    <video id="introVideo" playsinline preload="auto">
        <source src="assets/PokeIntro.mp4" type="video/mp4">
    </video>
</div>

<main class="site">  
<header>
    <img src="img/NovaDex-28-10-2026.png" alt="title">
    <h2>Cadastre seus Pokemons</h2>
</header>




    <div class="box">
        <div class="previewPokemon">
        <img src="" alt="Prévia do Pokémon">
        <h3></h3>
        <p></p>
    </div>

    <form>   
        
        <h2>NOVO POKEMON</h2>
        
        <div class="campo">
            <label for="name">Nome:</label>
            <input type="text" id="name" 
            placeholder="Digite o nome do pokemon"
            list="pokemonList"
            required>
            <datalist id="pokemonList"></datalist>
        </div>

        <div class="campo">
                <label for="nota">Nota:</label>
                <input type="number" id="nota" placeholder="0-10"
                min="0" max="10" required>
        </div>

        <div class="campoFav">
            <label for="favorito">Favorito:</label>
            <input type="checkbox" id="favorito">
        </div>

        <button id="pokAddBtn" type="button">Adicionar Pokemon</button>


    </form>

</div>
<div class="fadeIn">
<section class="painel">
    <div class="topoLista"><h2>Pokemons adicionados</h2>
    <div class="contador"><p>Total: 0</p></div></div>

    <div class="listaPokemon">
     
    </div>

</section>
</div>


</main>
<script src="script.js" defer></script>
</body>
</html>
